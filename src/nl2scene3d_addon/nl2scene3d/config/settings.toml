[gemini]
model_primary     = "gemini-3.5-flash"
model_fallback    = "gemini-2.5-flash"
max_retries       = 3
timeout_seconds   = 300
temperature       = 0.2
max_output_tokens = 32000

[pipeline]
max_movable_objects                = 50
wall_margin_meters                 = 0.2
max_overlap_ratio                  = 0.05
max_placement_attempts             = 500
min_quality_score_for_corrections  = 7
good_quality_score_for_protection  = 8
max_corrections_to_apply           = 5
skip_vision                        = false

[randomizer]
seed = 0

[render.preview]
width   = 512
height  = 512
samples = 64

[render.final]
width   = 1280
height  = 1280
samples = 256

[paths]
scenes_dir  = "scenes\\originals"
outputs_dir = "scenes\\outputs"

[logging]
level = "INFO"